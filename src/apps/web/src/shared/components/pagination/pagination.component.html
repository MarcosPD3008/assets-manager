<div class="pagination-container">
  <div class="pagination-info">
    @if (total > 0) {
      <span>Mostrando {{ startIndex }} - {{ endIndex }} de {{ total }} resultados</span>
    } @else {
      <span>No hay resultados</span>
    }
  </div>

  <div class="pagination-controls">
    <div class="page-size-selector">
      <span class="page-size-label">Elementos por página</span>
      <mat-select
        class="page-size-select"
        [value]="pageSize"
        (selectionChange)="onPageSizeChange($event.value)">
        @for (option of pageSizeOptions; track option) {
          <mat-option [value]="option">{{ option }}</mat-option>
        }
      </mat-select>
    </div>

    <div class="page-buttons">
      <button mat-icon-button [disabled]="isFirstPage" (click)="goToFirstPage()" matTooltip="Primera página">
        <mat-icon>first_page</mat-icon>
      </button>
      <button mat-icon-button [disabled]="isFirstPage" (click)="goToPreviousPage()" matTooltip="Página anterior">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <span class="page-indicator">Página {{ page }} de {{ totalPages || 1 }}</span>
      <button mat-icon-button [disabled]="isLastPage" (click)="goToNextPage()" matTooltip="Página siguiente">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button mat-icon-button [disabled]="isLastPage" (click)="goToLastPage()" matTooltip="Última página">
        <mat-icon>last_page</mat-icon>
      </button>
    </div>
  </div>
</div>
